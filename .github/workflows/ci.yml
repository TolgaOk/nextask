name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nextask_test
          POSTGRES_PASSWORD: nextask_test
          POSTGRES_DB: nextask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextask_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: postgres://nextask_test:nextask_test@localhost:5432/nextask_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Database test packages reset tables and must not share the DB concurrently.
      - run: go test -race -p 1 ./...
      - run: go build ./...
